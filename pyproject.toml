[project]
name = "redpilot"
version = "0.1.0"
description = "Autonomous AI-native penetration testing framework"
requires-python = ">=3.12"
authors = [{ name = "Redpilot Contributors" }]
dependencies = [
    "uvicorn>=0.51.0",
]

[tool.uv.workspace]
members = [
    "packages/*",
    "apps/api",
]

[tool.uv.sources]
redpilot-core = { workspace = true }
redpilot-orchestrator = { workspace = true }
redpilot-agents = { workspace = true }
redpilot-providers = { workspace = true }
redpilot-tools = { workspace = true }
redpilot-browser = { workspace = true }
redpilot-memory = { workspace = true }
redpilot-plugins = { workspace = true }
redpilot-reporting = { workspace = true }
redpilot-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1",
    "ruff>=0.5",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/core/src", "packages/tools/src", "packages/orchestrator/src"]
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
explicit_package_bases = true
namespace_packages = true
mypy_path = ["packages/core/src", "packages/tools/src", "packages/orchestrator/src"]

# Turn down strictness for test files
[[tool.mypy.overrides]]
module = "tests.*"
allow_untyped_defs = true
allow_untyped_calls = true
disable_error_code = ["var-annotated", "no-untyped-def"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "RUF"]

[tool.ruff.format]
quote-style = "double"
